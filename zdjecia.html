<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wasze zdjęcia – Agata i Daniel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #FAF7F2;
            font-family: 'Cormorant Garamond', serif;
            color: #3a3a3a;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 50px 20px;
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px auto;
            opacity: 0.85;
        }

        h1 {
            font-size: 38px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        p.subtitle {
            font-size: 19px;
            margin-bottom: 32px;
            opacity: 0.8;
        }

        .divider {
            width: 70px;
            height: 1px;
            background: #c8c1b5;
            margin: 30px auto;
        }

        .btn {
            display: inline-block;
            padding: 16px 26px;
            background: #e5dfd4;
            color: #3a3a3a;
            font-size: 19px;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.25s;
            border: none;
            cursor: pointer;
            min-width: 140px;
        }

        .btn:hover {
            background: #f0eae2;
        }

        .btn:disabled {
            background: #d6d2cb;
            cursor: not-allowed;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .thanks {
            margin-top: 40px;
            font-size: 18px;
            opacity: 0.85;
        }

        /* Status box */
        #statusBox {
            position: fixed;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a3a3a;
            color: white;
            padding: 14px 22px;
            border-radius: 10px;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 999;
        }

        /* Spinner */
        #spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            margin: -25px 0 0 -25px;
            border: 6px solid #e5dfd4;
            border-top: 6px solid #3a3a3a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: none;
            z-index: 1000;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Miniatura */
        #previewBox {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #previewImg {
            width: 90%;
            max-width: 380px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes successPulse {
            0% { transform: scale(1); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
            50% { transform: scale(1.03); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
            100% { transform: scale(1); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
        }
    </style>
</head>

<body>

    <div class="container">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>

        <h1>Wasze zdjęcia z naszego dnia</h1>
        <p class="subtitle">Zróbcie zdjęcie, uchwyćcie chwilę i dodajcie je do naszej historii.</p>

        <div class="divider"></div>

        <div class="btn-row">
            <button class="btn" onclick="openCamera()">Zrób zdjęcie</button>
            <button class="btn" onclick="openGallery()">Wybierz z galerii</button>
        </div>

        <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            style="display:none;"
            onchange="handlePhoto(this.files[0])"
        />

        <input
            id="galleryInput"
            type="file"
            accept="image/*"
            style="display:none;"
            onchange="handlePhoto(this.files[0])"
        />

        <!-- Miniatura -->
        <div id="previewBox">
            <img id="previewImg" src="" alt="Podgląd zdjęcia">
        </div>

        <p class="thanks">Dziękujemy, że tworzycie z nami tę historię.</p>

    </div>

    <div id="statusBox"></div>
    <div id="spinner"></div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby3mYvWX4IQK4kZc27TJCAzPqKL0IpTyaTo9j6MHWfYrEPS3OKfYc7aujXghxRu5vZFSQ/exec";

    function showStatus(msg) {
        const box = document.getElementById("statusBox");
        box.innerText = msg;
        box.style.opacity = "1";
        setTimeout(() => box.style.opacity = "0", 3000);
    }

    function showSpinner() {
        document.getElementById("spinner").style.display = "block";
    }

    function hideSpinner() {
        document.getElementById("spinner").style.display = "none";
    }

    function showPreview(base64) {
        const box = document.getElementById("previewBox");
        const img = document.getElementById("previewImg");

        img.src = "data:image/jpeg;base64," + base64;
        box.style.display = "block";
    }

    function openCamera() {
        document.getElementById('cameraInput').click();
    }

    function openGallery() {
        document.getElementById('galleryInput').click();
    }

    async function handlePhoto(file) {
        if (!file) return;

        showSpinner();
        showStatus("Wysyłanie zdjęcia…");

        // blokada przycisków na czas wysyłania
        document.querySelectorAll(".btn").forEach(btn => btn.disabled = true);

        const reader = new FileReader();

        reader.onload = async () => {
            const result = reader.result;
            const [meta, base64] = result.split(',');
            const mimeType = meta.match(/data:(.*);base64/)[1];

            showPreview(base64);

            const payload = {
                image: base64,
                mimeType: mimeType
            };

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const text = await res.text();

                hideSpinner();

                if (text.includes("OK")) {
                    showStatus("Zdjęcie zapisane! Dziękujemy ❤️");

                    // animacja sukcesu
                    document.getElementById("previewImg").style.animation = "successPulse 0.8s ease";

                } else {
                    showStatus("Ups… coś poszło nie tak 😢");
                }

            } catch (err) {
                hideSpinner();
                showStatus("Błąd wysyłania 😢");
            }

            // odblokowanie przycisków po wysłaniu
            document.querySelectorAll(".btn").forEach(btn => btn.disabled = false);
        };

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
