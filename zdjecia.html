<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wasze zdjęcia – Agata i Daniel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #FAF7F2;
            font-family: 'Cormorant Garamond', serif;
            color: #3a3a3a;
        }

        .page-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .panel {
            max-width: 420px;
            width: 100%;
            background: #fdfaf5;
            border-radius: 18px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.08);
            padding: 28px 22px 26px 22px;
            text-align: center;
            border: 1px solid rgba(200,193,181,0.45);
        }

        /* --- NAGŁÓWEK W STYLU akiedyslub.pl --- */
        .wedding-header {
    margin-bottom: 24px;
    animation: headerFadeIn 1s ease-out;
}


        .names {
    font-family: "Great Vibes", cursive;
    font-size: 3.6rem;
    margin-bottom: 0.3rem;
    font-weight: 400;
    color: #3a3a3a;
}


        .date {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.4rem;
    letter-spacing: 0.15rem;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 1.4rem;
}

        .panel-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 18px auto;
            opacity: 0.9;
        }

        h1 {
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 17px;
            margin-bottom: 22px;
            opacity: 0.85;
        }

        .divider {
            width: 60px;
            height: 1px;
            background: #c8c1b5;
            margin: 18px auto 22px auto;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            flex: 1;
            padding: 12px 10px;
            background: #e5dfd4;
            color: #3a3a3a;
            font-size: 16px;
            border-radius: 999px;
            text-decoration: none;
            transition: 0.25s;
            border: none;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f0eae2;
        }

        .btn:disabled {
            background: #d6d2cb;
            cursor: not-allowed;
        }

        .thanks {
            margin-top: 14px;
            font-size: 15px;
            opacity: 0.85;
        }

        /* Miniatura */
        #previewBox {
            margin-top: 16px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        #previewImg {
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            margin-top: 6px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes successPulse {
            0% { transform: scale(1); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
            50% { transform: scale(1.03); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
            100% { transform: scale(1); box-shadow: 0 4px 14px rgba(0,0,0,0.18); }
        }

        /* Status box */
        #statusBox {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #3a3a3a;
            color: white;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 15px;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 999;
        }

        /* Spinner */
        #spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 46px;
            height: 46px;
            margin: -23px 0 0 -23px;
            border: 5px solid #e5dfd4;
            border-top: 5px solid #3a3a3a;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            display: none;
            z-index: 1000;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
    .names {
        font-size: 2.8rem;
    }
    .date {
        font-size: 1.0rem;
        letter-spacing: 0.12rem;
    }
}
@keyframes headerFadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}


    </style>
</head>

<body>

<div class="page-wrap">
    <div class="panel">

        <!-- NAGŁÓWEK W STYLU akiedyslub.pl -->
        <div class="wedding-header">
            <div class="names">Agata i Daniel</div>
            <div class="date">5 WRZEŚNIA 2026</div>
        </div>

        <svg class="panel-icon" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>

        <h1>Wasze zdjęcia z naszego dnia</h1>
        <p class="subtitle">Zróbcie zdjęcie, uchwyćcie chwilę i dodajcie je do naszej galerii.</p>

        <div class="divider"></div>

        <div class="btn-row">
            <button class="btn" onclick="openCamera()">Zrób zdjęcie</button>
            <button class="btn" onclick="openGallery()">Wybierz z galerii</button>
        </div>

        <input id="cameraInput" type="file" accept="image/*" capture="environment" style="display:none;" onchange="handlePhoto(this.files[0])" />
        <input id="galleryInput" type="file" accept="image/*" style="display:none;" onchange="handlePhoto(this.files[0])" />

        <div id="previewBox">
            <img id="previewImg" src="" alt="Podgląd zdjęcia">
        </div>

        <p class="thanks">Dziękujemy, że tworzycie z nami tę historię.</p>

    </div>
</div>

<div id="statusBox"></div>
<div id="spinner"></div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby3mYvWX4IQK4kZc27TJCAzPqKL0IpTyaTo9j6MHWfYrEPS3OKfYc7aujXghxRu5vZFSQ/exec";

    function showStatus(msg) {
        const box = document.getElementById("statusBox");
        box.innerText = msg;
        box.style.opacity = "1";
        setTimeout(() => box.style.opacity = "0", 3000);
    }

    function showSpinner() {
        document.getElementById("spinner").style.display = "block";
    }

    function hideSpinner() {
        document.getElementById("spinner").style.display = "none";
    }

    function showPreview(base64) {
        const box = document.getElementById("previewBox");
        const img = document.getElementById("previewImg");

        img.src = "data:image/jpeg;base64," + base64;
        box.style.display = "block";
    }

    function openCamera() {
        document.getElementById('cameraInput').click();
    }

    function openGallery() {
        document.getElementById('galleryInput').click();
    }

    async function handlePhoto(file) {
        if (!file) return;

        showSpinner();
        showStatus("Wysyłanie zdjęcia…");
        document.querySelectorAll(".btn").forEach(btn => btn.disabled = true);

        const reader = new FileReader();

        reader.onload = async () => {
            const result = reader.result;
            const [meta, base64] = result.split(',');
            const mimeType = meta.match(/data:(.*);base64/)[1];

            showPreview(base64);

            const payload = {
                image: base64,
                mimeType: mimeType
            };

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });

                const text = await res.text();

                hideSpinner();

                if (text.includes("OK")) {
                    showStatus("Zdjęcie zapisane! Dziękujemy ❤️");
                    document.getElementById("previewImg").style.animation = "successPulse 0.8s ease";
                } else {
                    showStatus("Ups… coś poszło nie tak 😢");
                }

            } catch (err) {
                hideSpinner();
                showStatus("Błąd wysyłania 😢");
            }

            document.querySelectorAll(".btn").forEach(btn => btn.disabled = false);
        };

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
