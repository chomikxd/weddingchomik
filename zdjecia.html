<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wasze zdjęcia – Agata i Daniel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #FAF7F2;
            font-family: 'Cormorant Garamond', serif;
            color: #3a3a3a;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px auto;
            opacity: 0.85;
        }

        h1 {
            font-size: 42px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 20px;
            margin-bottom: 35px;
            opacity: 0.8;
        }

        .divider {
            width: 70px;
            height: 1px;
            background: #c8c1b5;
            margin: 35px auto;
        }

        .btn {
            display: inline-block;
            padding: 14px 34px;
            background: #e5dfd4;
            color: #3a3a3a;
            font-size: 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.25s;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #f0eae2;
        }

        .thanks {
            margin-top: 45px;
            font-size: 18px;
            opacity: 0.85;
        }

        .thanks-icon {
            width: 40px;
            height: 40px;
            margin: 15px auto 0 auto;
            opacity: 0.75;
        }
    </style>
</head>

<body>

    <div class="container">

        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>

        <h1>Wasze zdjęcia z naszego dnia</h1>
        <p class="subtitle">Zróbcie zdjęcie, uchwyćcie chwilę i dodajcie je do naszej historii.</p>

        <div class="divider"></div>

        <button class="btn" onclick="openCamera()">Zrób zdjęcie</button>

        <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            style="display:none;"
            onchange="handlePhoto(this.files[0])"
        />

        <p class="thanks">Dziękujemy, że tworzycie z nami tę historię.</p>

        <svg class="thanks-icon" viewBox="0 0 24 24" fill="none" stroke="#3a3a3a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
        </svg>

    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/library/d/1P4T6r0xES3sK1XwWSFglLjU3DmWqNfD9jRIcDyPptY7Jrc0WIguRxLox/5";

    function openCamera() {
        document.getElementById('cameraInput').click();
    }

    async function handlePhoto(file) {
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: formData
        });

        alert("Zdjęcie zostało wysłane!");
    }
</script>

</body>
</html>
